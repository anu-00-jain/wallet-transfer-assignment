plugins {
    id 'java'
    id 'application'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

application {
    mainClass = 'com.wallet.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Keep existing flat src/ and test/ layout (no src/main/java convention)
sourceSets {
    main {
        java { srcDirs = ['src'] }
        resources { srcDirs = [] }
    }
    test {
        java { srcDirs = ['test'] }
        resources { srcDirs = [] }
    }
}
